# ansible.cfg — EX294 연습용 템플릿
# ~/ansible/ansible.cfg 로 두고 그 디렉토리에서 ansible 실행
[defaults]
inventory = ./inventory
roles_path = ./roles
collections_path = ./collections
remote_user = devops
host_key_checking = False
# 개인 연습 편의 (실제 시험에선 문제 요구대로)
# forks = 10

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
